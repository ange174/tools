<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貪食蛇遊戲</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: #00ff00;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 0 0 10px #00ff00;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            color: #fff;
            font-size: 1.2em;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 8px;
            flex: 1;
            margin: 0 5px;
        }

        .info-label {
            color: #00ff00;
            font-weight: bold;
        }

        canvas {
            border: 3px solid #00ff00;
            background: #000;
            display: block;
            margin: 20px auto;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .controls {
            color: #fff;
            margin: 20px 0;
            font-size: 0.95em;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }

        button {
            padding: 12px 25px;
            font-size: 1em;
            background: #00ff00;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        button:hover {
            background: #00cc00;
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        .game-over {
            color: #ff0000;
            font-size: 1.5em;
            margin-top: 10px;
            font-weight: bold;
            display: none;
        }

        .instructions {
            color: #00ff00;
            margin-top: 20px;
            font-size: 0.9em;
            text-align: left;
            background: rgba(0, 255, 0, 0.1);
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid #00ff00;
        }

        .instructions h3 {
            margin-bottom: 10px;
        }

        .instructions p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐍 貪食蛇遊戲</h1>
        
        <div class="game-info">
            <div class="info-item">
                <span class="info-label">分數:</span> <span id="score">0</span>
            </div>
            <div class="info-item">
                <span class="info-label">速度:</span> <span id="speed">10</span>
            </div>
            <div class="info-item">
                <span class="info-label">蛇長:</span> <span id="length">1</span>
            </div>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <div class="game-over" id="gameOver">
            🎮 遊戲結束！最終分數: <span id="finalScore">0</span>
        </div>

        <div class="controls">
            ⬆️ ⬇️ ⬅️ ➡️ 使用方向鍵控制<br>
            或 W/A/S/D 鍵 - 吃不同的動物！
        </div>

        <div class="button-group">
            <button onclick="togglePause()">⏸️ 暫停/繼續</button>
            <button onclick="resetGame()">🔄 重新開始</button>
        </div>

        <div class="instructions">
            <h3>📋 遊戲規則：</h3>
            <p>✓ 使用方向鍵或 WASD 控制蛇的方向</p>
            <p>✓ 吃掉動物增加分數（+10分）</p>
            <p>✓ 每吃一個動物蛇會增長</p>
            <p>✓ 撞到牆壁或自己就遊戲結束</p>
            <p>✓ 可以按暫停按鈕暫停遊戲</p>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const gridSize = 20;
        const gridWidth = canvas.width / gridSize;
        const gridHeight = canvas.height / gridSize;

        const animals = ['🐭', '🐔', '🐷', '🐮', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐸', '🐢', '🦀', '🐟', '🐙', '🦑', '🦋', '🐝', '🐞'];
        let currentAnimal = animals[Math.floor(Math.random() * animals.length)];

        function generateFood() {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * gridWidth),
                    y: Math.floor(Math.random() * gridHeight)
                };
            } while (snake.some(segment => segment.x === newFood.x && segment.y === newFood.y));
            // 隨機選擇一種動物
            currentAnimal = animals[Math.floor(Math.random() * animals.length)];
            return newFood;
        }

        let snake = [{x: Math.floor(gridWidth / 2), y: Math.floor(gridHeight / 2)}];
        let direction = {x: 1, y: 0};
        let nextDirection = {x: 1, y: 0};
        let food = generateFood();
        let score = 0;
        let gameOver = false;
        let gamePaused = false;
        let gameSpeed = 3;

        function update() {
            if (gameOver || gamePaused) return;

            direction = nextDirection;

            const head = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            // 檢查碰撞牆壁
            if (head.x < 0 || head.x >= gridWidth || head.y < 0 || head.y >= gridHeight) {
                endGame();
                return;
            }

            // 檢查碰撞自己
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                endGame();
                return;
            }

            snake.unshift(head);

            // 檢查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                food = generateFood();
                
                // 逐漸加速
                if (score % 50 === 0 && gameSpeed < 20) {
                    gameSpeed += 1;
                }
            } else {
                snake.pop();
            }

            updateUI();
        }

        function draw() {
            // 清空畫布
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 繪製網格
            ctx.strokeStyle = '#111';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= gridWidth; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i <= gridHeight; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // 繪製蛇
            snake.forEach((segment, index) => {
                if (index === 0) {
                    // 頭部 - 綠色
                    ctx.fillStyle = '#00ff00';
                    ctx.shadowColor = '#00ff00';
                    ctx.shadowBlur = 10;
                } else {
                    // 身體 - 淡綠色
                    ctx.fillStyle = '#00cc00';
                    ctx.shadowColor = 'transparent';
                }
                ctx.fillRect(
                    segment.x * gridSize + 1,
                    segment.y * gridSize + 1,
                    gridSize - 2,
                    gridSize - 2
                );
            });

            ctx.shadowColor = 'transparent';

            // 繪製食物 - 動物 emoji
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(
                currentAnimal,
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2
            );

            // 如果遊戲暫停，顯示暫停文本
            if (gamePaused) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffff00';
                ctx.font = 'bold 30px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('⏸ 已暫停', canvas.width / 2, canvas.height / 2);
            }
        }

        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('speed').textContent = gameSpeed;
            document.getElementById('length').textContent = snake.length;
        }

        function endGame() {
            gameOver = true;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }

        function resetGame() {
            snake = [{x: Math.floor(gridWidth / 2), y: Math.floor(gridHeight / 2)}];
            direction = {x: 1, y: 0};
            nextDirection = {x: 1, y: 0};
            food = generateFood();
            score = 0;
            gameOver = false;
            gamePaused = false;
            gameSpeed = 3;
            document.getElementById('gameOver').style.display = 'none';
            updateUI();
        }

        function togglePause() {
            if (!gameOver) {
                gamePaused = !gamePaused;
            }
        }

        // 鍵盤控制
        document.addEventListener('keydown', (e) => {
            switch(e.key.toLowerCase()) {
                case 'arrowup':
                case 'w':
                    if (direction.y === 0) nextDirection = {x: 0, y: -1};
                    e.preventDefault();
                    break;
                case 'arrowdown':
                case 's':
                    if (direction.y === 0) nextDirection = {x: 0, y: 1};
                    e.preventDefault();
                    break;
                case 'arrowleft':
                case 'a':
                    if (direction.x === 0) nextDirection = {x: -1, y: 0};
                    e.preventDefault();
                    break;
                case 'arrowright':
                case 'd':
                    if (direction.x === 0) nextDirection = {x: 1, y: 0};
                    e.preventDefault();
                    break;
                case ' ':
                    togglePause();
                    e.preventDefault();
                    break;
            }
        });

        // 遊戲循環
        function gameLoop() {
            update();
            draw();
        }

        setInterval(gameLoop, 1000 / gameSpeed);
        
        // 初始繪製
        updateUI();
        draw();
    </script>
</body>
</html>
